[package]
name = "zec-sidecar"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
publish = false
description = "Silicr's Zcash testnet light wallet: Orchard-receiver-only, Ironwood/Orchard-protocol spends only, JSON lines over stdio"

# Versions track the released librustzcash crates (the 2026-10-21 set: zcash_client_backend 0.25,
# zcash_primitives 0.31, zcash_protocol 0.11), which know NU7 (ZIP 259, branch id 0x77190ad9):
# testnet from 4,465,026, mainnet from 3,543,405. Upgrade the whole set together.
[dependencies]
anyhow = "1"
bip0039 = { version = "0.14", features = ["std"] }
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = "0.3"
hex = "0.4"
# SOCKS5 connector for tonic (src/socks.rs): TokioIo + the tower Service trait; both already in the lock via tonic.
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
prost = "0.14"
rand = { version = "0.10", default-features = false, features = ["std", "sys_rng"] }
rusqlite = { version = "0.37", features = ["bundled"] }
secrecy = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.21", features = ["fs", "io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tonic = { version = "0.14", features = ["gzip", "tls-ring", "tls-webpki-roots"] }
tower-service = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# FROST 2-of-3 bond custody (src/frost.rs). orchard 0.16 pins reddsa 0.6, which dropped the FROST
# module, so the Zcash Foundation's reddsa 0.5.2 (`frost::redpallas`, frost-core 3.0) is linked as a
# second crate and bridged to orchard through byte encodings. rand_core 0.6 is what frost-core 3 takes.
blake2b_simd = "1"
ff = "0.14"
frost-rerandomized = { version = "3.0.0", default-features = false, features = ["serialization"] }
pasta_curves = "0.6"
rand_core06 = { package = "rand_core", version = "0.6", features = ["getrandom"] }
reddsa_frost = { package = "reddsa", version = "0.5.2", default-features = false, features = ["std", "frost"] }

# Zcash. `pczt` exists for the FROST bond spend only (an external signer needs a PCZT); the wallet
# still never touches transparent funds (the transparent-inputs feature it drags in is compiled, not used).
orchard = { version = "0.16.0", default-features = false, features = ["circuit"] }
pczt = { version = "0.10.0", features = ["orchard", "prover", "signer", "io-finalizer", "spend-finalizer", "tx-extractor"] }
sapling = { package = "sapling-crypto", version = "0.9" }
zcash_address = "0.14.0"
zcash_client_backend = { version = "0.25.0", features = ["lightwalletd-tonic-tls-webpki-roots", "orchard", "pczt"] }
zcash_client_sqlite = { version = "0.23.0", features = ["orchard", "serde", "transparent-inputs"] }
zcash_keys = { version = "0.17.0", features = ["orchard", "sapling", "unstable-frost"] }
zcash_primitives = "0.31.0"
zcash_proofs = { version = "0.31.0", features = ["bundled-prover"] }
zcash_protocol = "0.11.0"
zip32 = "0.3"
zip321 = "0.10"

[profile.release]
# Proving is the hot path; keep debug assertions off but symbols on for useful backtraces.
debug = "line-tables-only"
