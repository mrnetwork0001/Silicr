# Silicr hosted demos: /etc/nginx/sites-available/silicr (the only nginx file Silicr owns).
# nginx 1.24: `listen 443 ssl;` and no `http2 on;`.
#   silicr.xyz (www -> apex)      landing page, static export            /var/www/silicr/landing
#   app.silicr.xyz                testnet terminal + daemons             127.0.0.1:8700-8703 (compose project `silicr`)
#   mainnet.silicr.xyz            MAINNET demo terminal + daemons        127.0.0.1:8710-8713 (compose project `silicr-main`)
#   *.38-49-213-208.sslip.io      the old names, kept as aliases of the landing page and the testnet terminal
# One certificate covers the four silicr.xyz names (/etc/letsencrypt/live/silicr.xyz); the sslip names
# keep their own. deploy.sh installs this file with the `xyz-tls` blocks stripped until that
# certificate exists, and with the `app-tls` block stripped until the sslip app certificate exists.

# ---------- HTTP: ACME challenges, everything else to HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name silicr.xyz app.silicr.xyz mainnet.silicr.xyz silicr.38-49-213-208.sslip.io app.silicr.38-49-213-208.sslip.io;
    location /.well-known/acme-challenge/ { root /var/www/silicr; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 80;
    listen [::]:80;
    server_name www.silicr.xyz;
    location /.well-known/acme-challenge/ { root /var/www/silicr; }
    location / { return 301 https://silicr.xyz$request_uri; }
}

# BEGIN xyz-tls
# ---------- landing: silicr.xyz (www -> apex) ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.silicr.xyz;
    ssl_certificate     /etc/letsencrypt/live/silicr.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/silicr.xyz/privkey.pem;
    return 301 https://silicr.xyz$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name silicr.xyz;
    ssl_certificate     /etc/letsencrypt/live/silicr.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/silicr.xyz/privkey.pem;

    root /var/www/silicr/landing;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location /_next/static/ { expires 30d; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location / { try_files $uri $uri.html $uri/ =404; }
    error_page 404 /404.html;
}

# ---------- testnet terminal + daemons: app.silicr.xyz ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.silicr.xyz;
    ssl_certificate     /etc/letsencrypt/live/silicr.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/silicr.xyz/privkey.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    client_max_body_size 2m;

    # Shared by every upstream: HTTP/1.1, no buffering (SSE on /api/events), long reads.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # The daemons accept loopback Host names only (DNS-rebinding guard), so the upstream sees
    # Host 127.0.0.1; the public name travels in X-Forwarded-Host for --trust-proxy.
    # The proxies live under /api/… so they never collide with a Next page: a prefix location
    # /provider/ made nginx 301 the terminal's /provider page to /provider/, i.e. the daemon's "/".
    # The terminal has no /api routes of its own (apps/web/app has none).
    location /api/buyer/ {
        proxy_pass http://127.0.0.1:8701/;
        proxy_set_header Host 127.0.0.1;
    }
    location /api/provider/ {
        proxy_pass http://127.0.0.1:8702/;
        proxy_set_header Host 127.0.0.1;
    }
    location /api/relay/ {
        proxy_pass http://127.0.0.1:8700/;
        proxy_set_header Host 127.0.0.1;
    }
    location / {
        proxy_pass http://127.0.0.1:8703;
        proxy_set_header Host $host;
    }
}

# ---------- MAINNET demo terminal + daemons: mainnet.silicr.xyz (real ZEC, tiny capped wallet) ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mainnet.silicr.xyz;
    ssl_certificate     /etc/letsencrypt/live/silicr.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/silicr.xyz/privkey.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    client_max_body_size 2m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    location /api/buyer/ {
        proxy_pass http://127.0.0.1:8711/;
        proxy_set_header Host 127.0.0.1;
    }
    location /api/provider/ {
        proxy_pass http://127.0.0.1:8712/;
        proxy_set_header Host 127.0.0.1;
    }
    location /api/relay/ {
        proxy_pass http://127.0.0.1:8710/;
        proxy_set_header Host 127.0.0.1;
    }
    location / {
        proxy_pass http://127.0.0.1:8713;
        proxy_set_header Host $host;
    }
}
# END xyz-tls

