# Silicr hosted testnet demo: /etc/nginx/sites-available/silicr (the only nginx file Silicr owns).
# nginx 1.24: `listen 443 ssl;` and no `http2 on;`. Upstreams are 127.0.0.1:8700-8703 (compose
# project `silicr`). deploy.sh installs this with the app TLS block stripped until its cert exists.

# ---------- landing: silicr.38-49-213-208.sslip.io (static export) ----------
server {
    listen 80;
    listen [::]:80;
    server_name silicr.38-49-213-208.sslip.io;
    location /.well-known/acme-challenge/ { root /var/www/silicr; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name silicr.38-49-213-208.sslip.io;
    ssl_certificate     /etc/letsencrypt/live/silicr.38-49-213-208.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/silicr.38-49-213-208.sslip.io/privkey.pem;

    root /var/www/silicr/landing;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location /_next/static/ { expires 30d; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location / { try_files $uri $uri.html $uri/ =404; }
    error_page 404 /404.html;
}

# ---------- terminal + daemons: app.silicr.38-49-213-208.sslip.io ----------
server {
    listen 80;
    listen [::]:80;
    server_name app.silicr.38-49-213-208.sslip.io;
    location /.well-known/acme-challenge/ { root /var/www/silicr; }
    location / { return 301 https://$host$request_uri; }
}

# BEGIN app-tls
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.silicr.38-49-213-208.sslip.io;
    ssl_certificate     /etc/letsencrypt/live/app.silicr.38-49-213-208.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.silicr.38-49-213-208.sslip.io/privkey.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    client_max_body_size 2m;

    # Shared by every upstream: HTTP/1.1, no buffering (SSE on /api/events), long reads.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # The daemons accept loopback Host names only (DNS-rebinding guard), so the upstream sees
    # Host 127.0.0.1; the public name travels in X-Forwarded-Host for --trust-proxy.
    location /buyer/ {
        proxy_pass http://127.0.0.1:8701/;
        proxy_set_header Host 127.0.0.1;
    }
    location /provider/ {
        proxy_pass http://127.0.0.1:8702/;
        proxy_set_header Host 127.0.0.1;
    }
    location /relay/ {
        proxy_pass http://127.0.0.1:8700/;
        proxy_set_header Host 127.0.0.1;
    }

    location / {
        proxy_pass http://127.0.0.1:8703;
        proxy_set_header Host $host;
    }
}
# END app-tls
