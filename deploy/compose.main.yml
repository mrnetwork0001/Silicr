# Silicr hosted MAINNET demo: real ZEC from a tiny hard-capped shared wallet. Compose project
# `silicr-main`, image silicr-node:main (built by deploy.sh --main with the mainnet.silicr.xyz
# origins baked into the web terminal), data under /opt/silicr-main/data, ports 127.0.0.1:8710-8713
# fronted by nginx (mainnet.silicr.xyz). The daemons run --public-demo --allow-mainnet with the
# caps 0.001 ZEC per request and 0.005 ZEC in all (payments and fees; the engine refuses any request
# whose worst case does not fit). Same hardening as compose.yml.
#   docker compose -p silicr-main -f compose.main.yml up -d
name: silicr-main

x-hardening: &hardening
  image: silicr-node:main
  pull_policy: never
  restart: unless-stopped
  init: false            # tini is the image entrypoint
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:size=256m,mode=1777
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: "3" }
  networks: [silicr-main]

services:
  relay:
    <<: *hardening
    command: ["sh", "-c", "exec $$TSX packages/relay/src/main.ts --host 0.0.0.0 --port 8710 --data /data/relay --observer --ttl-hours 24"]
    ports: ["127.0.0.1:8710:8710"]
    volumes:
      - /opt/silicr-main/data/relay:/data/relay
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M, pids: 128 }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8710/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # The process runner executes jobs inside this container: the container is the sandbox (see compose.yml).
  # Mainnet demo provider: asks 0.0005 ZEC/h, 60 s intervals, bids only with >= 0.0003 ZEC for fees.
  # --gpu a100 --count 1 --vram 80 is what it advertises (policy.json is not copied by deploy.sh and
  # PUT /api/policy is disabled in the public demo); the job still runs on the container's CPU.
  provider:
    <<: *hardening
    command:
      - node
      - deploy/fwd.mjs
      - "8712"
      - "7712"
      - --
      - packages/cli/node_modules/.bin/tsx
      - packages/cli/src/main.ts
      - daemon
      - --data
      - /data/wallets/demo-main-provider
      - --role
      - provider
      - --network
      - main
      - --cap-per-request
      - "0.001"
      - --cap-total
      - "0.005"
      - --port
      - "7712"
      - --relay
      - http://relay:8710
      - --runner
      - process
      - --gpu
      - a100
      - --count
      - "1"
      - --vram
      - "80"
      - --public-origin
      - https://mainnet.silicr.xyz
      - --trust-proxy
      - --public-demo
      - --allow-mainnet
    ports: ["127.0.0.1:8712:8712"]
    volumes:
      - /opt/silicr-main/data/wallets/demo-main-provider:/data/wallets/demo-main-provider
    depends_on:
      relay: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G, pids: 256 }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8712/api/status').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

  buyer:
    <<: *hardening
    command:
      - node
      - deploy/fwd.mjs
      - "8711"
      - "7711"
      - --
      - packages/cli/node_modules/.bin/tsx
      - packages/cli/src/main.ts
      - daemon
      - --data
      - /data/wallets/demo-main-buyer
      - --role
      - buyer
      - --network
      - main
      - --cap-per-request
      - "0.001"
      - --cap-total
      - "0.005"
      - --port
      - "7711"
      - --relay
      - http://relay:8710
      - --public-origin
      - https://mainnet.silicr.xyz
      - --trust-proxy
      - --public-demo
      - --allow-mainnet
    ports: ["127.0.0.1:8711:8711"]
    volumes:
      - /opt/silicr-main/data/wallets/demo-main-buyer:/data/wallets/demo-main-buyer
    depends_on:
      relay: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G, pids: 256 }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8711/api/status').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

  web:
    <<: *hardening
    working_dir: /app/apps/web
    command: ["node_modules/.bin/next", "start", "-H", "0.0.0.0", "-p", "8713"]
    ports: ["127.0.0.1:8713:8713"]
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /app/apps/web/.next/cache:size=128m,mode=1777
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M, pids: 128 }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8713/').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  silicr-main:
    name: silicr-main
